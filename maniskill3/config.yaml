# environment
env_id: PushCube-v1
obs: state
control_mode: default
num_envs: 32
num_eval_envs: 4
env_type: gpu
include_state: true
render_mode: rgb_array
render_size: 64

# evaluation
checkpoint: /root/td-mpc-opt/tdmpc2/models/multitask/mt30-317M.pt
eval_episodes_per_env: 2
eval_freq: 50000
eval_reconfiguration_frequency: 1

# training
steps: 100000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
consistency_coef: 20
rho: 0.5
lr: 0.0003
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1000000
exp_name: "ms3_distill_1M"
data_dir: /root/td-mpc-opt/data/mt30
steps_per_update: 1

# architecture
model_size: 1
num_enc_layers: 2
enc_dim: 256
mlp_dim: 384
latent_dim: 128
task_dim: 0
num_q: 2
dropout: 0.01
simnorm_dim: 8

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 0.0001

# critic
num_bins: 101
vmin: -10
vmax: 10

# logging
wandb_project: "maniskill3_eval"
wandb_entity: ???
wandb_silent: false
disable_wandb: false
save_csv: true

# misc
save_video_local: false
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: false
tasks:
  - "PushCube-v1"
obs_shape: ???
action_dim: ???
episode_length: ???
seed_steps: ???
bin_size: ???
true_latent_dim: ???
discount: ???
distill_coef: 1.0

