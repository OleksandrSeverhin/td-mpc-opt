defaults:
    - override hydra/launcher: submitit_local

# environment
env_id: PushCube-v1 # Placeholder: Set to the specific task you are evaluating
obs: state 
control_mode: default 
num_envs: 32
num_eval_envs: 4
env_type: gpu 
include_state: true 
render_mode: rgb_array 
render_size: 64

# evaluation
checkpoint: /root/td-mpc-opt/tdmpc2/models/mt30-317M.pt
eval_episodes_per_env: 2 # Total 8 episodes (2 * 4 envs)
eval_freq: 50000
eval_reconfiguration_frequency: 1

# training
steps: 100_000         # Kept at 100k for MT30 comparability
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 60000     # Kept at 60k for MT30 comparability
exp_name: "single_eval_317M"
data_dir: /root/td-mpc-opt/data/mt30
steps_per_update: 1

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture (Identical to 317M MT30 setup)
model_size: 317
num_enc_layers: 5
enc_dim: 4096
num_channels: 32
mlp_dim: 4096
latent_dim: 1376
[cite_start]task_dim: 96           # Kept at 96 to match the checkpoint's input layer 
num_q: 8
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: "maniskill3_eval"
wandb_entity: ???
wandb_silent: false
disable_wandb: false
save_csv: true

# misc
save_video_local: false 
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: false       # Set to false for single-task run
tasks: ["PushCube-v1"] # Single task list
obs_shape: ???
action_dim: ???
episode_length: ???
seed_steps: ???

# ManiSkill RL Baselines Blocks
env_cfg:
    env_id: ${env_id}
    control_mode: ${control_mode}
    obs_mode: ${obs}
    num_envs: ${num_envs}
    sim_backend: ${env_type}
eval_env_cfg:
    env_id: ${env_id}
    control_mode: ${control_mode}
    obs_mode: ${obs}
    num_envs: ${num_eval_envs}
    sim_backend: ${env_type}