task: maniskill3
obs: state

# Evaluation settings
checkpoint: /root/td-mpc-opt/tdmpc2/models/models--oleksandr-severhin--td-mpc-opt/snapshots/befbc68dcc71c956ca6b86951b84d0d919b61440/mt30_1M_steps_50_cosine_decay_final.pt
eval_episodes: 10
eval_freq: 5000

# Multi-task settings
multitask: true
tasks:
  - "PickCube-v1"
  - "StackCube-v1"
  - "PegInsertionSide-v1"
  - "PushCube-v1"
  - "PullCube-v1"
  - "PlaceSphere-v1"
  - "LiftPegUpright-v1"
  - "PlugCharger-v1"
  - "PickSingleYCB-v1"
  - "RollBall-v1"
  - "PokeCube-v1"
  - "PullCubeTool-v1"
  - "AssemblingKits-v1"
  - "PushT-v1"
  - "TwoRobotPickCube-v1"
  - "TwoRobotStackCube-v1"
  - "PickCubeSO100-v1"
  - "PickCubeWidowXAI-v1"
  - "TurnFaucet-v1"
  - "OpenCabinetDoor-v1"
  - "OpenCabinetDrawer-v1"

# Training settings
steps: 25000 # Using underscores is not standard for YAML.
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
consistency_coef: 20
rho: 0.5
lr: 0.0003 # Using 3e-4 is not standard for YAML.
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 500000
exp_name: maniskill3_multitask_eval
data_dir: /root/td-mpc-opt/data/maniskill3

# Distillation settings
distillation:
  schedule: "cosine_decay"
  d_coef: 0.4
  temperature: 2.0
  weight: 0.5

# Planning settings
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# Actor and critic settings
actor:
  log_std_min: -10
  log_std_max: 2
  entropy_coef: 0.0001
critic:
  num_bins: 101
  vmin: -10
  vmax: +10

# Architecture settings
architecture:
  model_size: 1
  num_enc_layers: 2
  enc_dim: 256
  num_channels: 32
  mlp_dim: 384
  latent_dim: 128
  task_dim: 96
  num_q: 2
  dropout: 0.01
  simnorm_dim: 8

# Logging settings
wandb_project: td-mpc-maniskill3
wandb_entity: ???
wandb_silent: false
disable_wandb: false
save_csv: true
save_video: true
save_agent: true
seed: 1

# Auto-populated fields
work_dir: ???
task_title: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???