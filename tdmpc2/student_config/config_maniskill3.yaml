# Fixed ManiSkill3 Configuration
task: maniskill3
obs: state  
checkpoint: tdmpc2/models/models--oleksandr-severhin--td-mpc-opt/snapshots/befbc68dcc71c956ca6b86951b84d0d919b61440/mt30_1M_steps_50_cosine_decay_final.pt
eval_episodes: 10
eval_freq: ???

# Multi-task evaluation settings
multi_task_eval: true  
eval_all_tasks: true  
continue_on_failure: true  
save_individual_results: true  
parallel_eval: false

# Core multi-task settings (MOVED TO TOP LEVEL - this was the main issue)
multitask: true
tasks:
  - "PickCube-v1"          
  - "StackCube-v1"        
  - "PegInsertionSide-v1"  
  - "PushCube-v1"        
  - "PullCube-v1"        
  - "PlaceSphere-v1"      
  - "LiftPegUpright-v1"  
  - "PlugCharger-v1"      
  - "PickSingleYCB-v1"  
  - "RollBall-v1"        
  - "PokeCube-v1"      
  - "PullCubeTool-v1"      
  - "AssemblingKits-v1"    
  - "PushT-v1"            
  - "TwoRobotPickCube-v1"
  - "TwoRobotStackCube-v1"
  - "PickCubeSO100-v1"    
  - "PickCubeWidowXAI-v1"  
  - "TurnFaucet-v1"        
  - "OpenCabinetDoor-v1"  
  - "OpenCabinetDrawer-v1"

# Training settings
steps: 25_000 # 50_000, 100_000, 200_000, 337_000, 1_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20 # 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 500_000 # 1_000_000
exp_name: maniskill3_multitask_eval
data_dir: /root/td-mpc-opt/data/maniskill3

# Distillation settings
distillation:
  schedule: "cosine_decay"
  d_coef: 0.4

# Planning settings
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# Actor settings
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# Critic settings
num_bins: 101
vmin: -10
vmax: +10

# Distillation parameters
distillation_temperature: 2.0
distillation_weight: 0.5

# Architecture settings
model_size: 1
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 384
latent_dim: 128
task_dim: 96
num_q: 2
dropout: 0.01
simnorm_dim: 8

# ManiSkill 3 Multi-Task Configuration
maniskill3:
  # Environment configuration
  env_kwargs:
    obs_mode: "state"  
    control_mode: "pd_ee_delta_pose"
    render_mode: "rgb_array"
    sim_freq: 500
    control_freq: 20
    max_episode_steps: 50  
    
  # Observation space settings
  obs_space_type: "dict"
  
  # Action space settings
  action_space_type: "continuous"
  
  # Evaluation specific settings
  eval_env_kwargs:
    render_mode: "human"  # For visualization during evaluation
    
  # GPU settings for ManiSkill 3
  sim_backend: "gpu"  
  num_envs: 1  # Number of parallel environments
  
  # Results and logging settings for multi-task evaluation
  results_dir: "./results/maniskill3_multitask"
  summary_file: "evaluation_summary.csv"
  detailed_logs: true
  save_videos: true  # Save videos for successful episodes
  video_dir: "./videos/maniskill3_eval"

# Logging settings
wandb_project: td-mpc-maniskill3
wandb_entity: ???
wandb_silent: false
disable_wandb: false
save_csv: true

# Weights & Biases multi-task logging
wandb_multitask:
  log_per_task: true  # Create separate W&B runs for each task
  group_name: "maniskill3_multitask_eval"  # Group all runs together
  job_type: "evaluation"

# Miscellaneous settings
save_video: true  
save_agent: true
seed: 1

# Multi-task evaluation specific settings
work_dir: "./results/maniskill3_multitask"
task_title: "ManiSkill3 Multi-Task Evaluation"

